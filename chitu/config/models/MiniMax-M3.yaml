dense_intermediate_size: 12288
moe_inter_dim: 3072
shared_intermediate_size: 3072
n_routed_experts: 128
n_shared_experts: 1
n_activated_experts: 4
n_expert_groups: 1
n_limited_groups: 1
score_func: "sigmoid"
norm_topk_prob: true
route_scale: 2.0
swiglu_alpha: 1.702
swiglu_limit: 7.0
index_n_heads: 4
index_head_dim: 128
index_block_size: 128
index_topk_blocks: 16
index_local_blocks: 1
rope_theta: 5000000.0
bos_token_id: 200034
eos_token_id: 200020
