name: MiniMax-M3
type: minimax-m3-vl
source: "https://huggingface.co/MiniMaxAI/MiniMax-M3" # Just for displaying. No automatic download.
tokenizer_type: "hf" # one of: hf, tiktoken

dim: 6144
head_dim: 128
vocab_size: 200064
n_layers: 60
n_heads: 64
n_kv_heads: 4
norm_eps: 1e-6
tie_word_embeddings: false
qkv_has_bias: false
n_attn_dense_layers: 3
