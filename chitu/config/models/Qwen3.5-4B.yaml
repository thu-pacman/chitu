name: Qwen3.5-4B
type: hf-qwen3-5
source: "https://huggingface.co/Qwen/Qwen3.5-4B" # Just for displaying. No automatic download.
tokenizer_type: "hf" # one of: hf, tiktoken
processor_path: null

dim: 2560
n_layers: 32
n_heads: 16
n_kv_heads: 4
vocab_size: 248320
intermediate_dim: 9216
norm_topk_prob: True
norm_eps: 1e-06
qkv_has_bias: False
head_dim: 256
use_qk_norm: True
linear_conv_kernel_dim: 4
linear_head_dim: 128
linear_n_qk_heads: 16
linear_n_v_heads: 32
eos_token_id: 248044
full_attention_interval: 4
num_full_attention_blocks: -1 # kv cache blocks for full attention layers, could override num_blocks
num_linear_attention_blocks: -1 # kv cache blocks for linear attention layers, could override num_blocks
linear_attention_impl: "auto" # choices=["auto", "torch", "fla"]
tie_word_embeddings: True

rope_theta: 10000000.0
partial_rotary_factor: 0.25
rope_scaling:
  rope_type: mrope
  mrope_section: [11, 11, 10]
  mrope_interleaved: true

vision_config:
  depth: 24
  hidden_act: "gelu_pytorch_tanh"
  hidden_size: 1024
  intermediate_size: 4096
  num_heads: 16
  in_channels: 3
  out_hidden_size: 2560
  patch_size: 16
  spatial_merge_size: 2
  temporal_patch_size: 2
  num_position_embeddings: 2304
  deepstack_visual_indexes: []
  vision_start_token_id: 248053
  image_token_id: 248056
  video_token_id: 248057
  vision_end_token_id: 248054
  max_vision_tokens: 16384

tool_parser: Qwen3CoderToolParser
reasoning_type: switchable
