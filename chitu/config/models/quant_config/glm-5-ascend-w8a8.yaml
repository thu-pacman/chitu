# Compressed-tensors W8A8 (per-channel weight + per-token dynamic activation)
# checkpoint for GLM-5 / GLM-5.1 on Ascend NPU.
#
# - All quantized linears use the bf16 `weight_scale` of shape (out, 1) in 
# the checkpoint.
# - kv_b_proj is left unquantized in the rule set: the model code in
#   `_normalize_w8a8_kv_b_proj_checkpoint` folds (int8 * weight_scale) back
#   into bf16 before MLA absorption.

quant:
- model: '.'
  rules:
    - regex: 'kv_b_proj'
      type: null
    - regex: '\.self_attn'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp\.(shared_experts\.|experts\.|moe)'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp\.(gate_proj|gate_up_proj|up_proj|down_proj)'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
