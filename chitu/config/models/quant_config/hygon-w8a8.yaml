# Hygon W8A8 checkpoints use `weight_scale` naming and are loaded through `w8a8_dynamic`.

quant:
- model: '.'
  rules:
    - regex: 'kv_b_proj'
      type: null
    - regex: '(\.self_attn|\.mlp\.(shared_experts\.)?(gate_proj|gate_up_proj|up_proj|down_proj))'
      type: w8a8_dynamic
    - regex: '\.mlp\.(moe|experts)'
      type: w8a8_dynamic
