# Block INT4 quantization — only routed expert weights are quantized
# (4-bit, group_size=32, symmetric); attention, shared experts, dense MLP,
# and embeddings remain in their original dtype.

quant:
- model: '.'
  rules:
    - regex : '\.mlp\.(moe|experts\.)'
      type : blockint4
      kwargs:
        group_size: 32
