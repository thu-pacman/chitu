# MiniMax-M3-MXFP8 (vLLM ModelOpt MXFP8): weight_block_size [1, 32], E8M0 scale as uint8.
# Checkpoint keys use weight_scale_inv; round_scale_to_pow2 enables UE8M0 scale semantics.

quant:
- model: '.'
  rules:
    - regex : 'layers\.'
      type : blockfp8
      kwargs:
        round_scale_to_pow2: true
        scale_block_shape: [1, 32]
