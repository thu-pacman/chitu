quant: 
- model: '.'
  rules:
    - regex: '\.self_attn'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.moe'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.experts\.'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.gate_proj'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.gate_up_proj'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.up_proj'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp.down_proj'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
