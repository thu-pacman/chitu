quant: 
- model: "deepseek"
  rules:
    - regex : '\.ffn\.experts\.'
      type: mxfp4
    - regex : '(\.attn\.(wq_a|wq_b|wkv|wo_a|wo_b)\.|\.attn\.indexer\.wq_b\.|\.ffn\.shared_experts\.)'
      type: blockfp8
      kwargs:
        round_scale_to_pow2: true
