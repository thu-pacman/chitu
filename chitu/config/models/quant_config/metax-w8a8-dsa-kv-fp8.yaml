# Preserve metax-w8a8's model quantization rules and add only the packed MLA
# FP8 KV cache policy. indexer_k intentionally remains BF16.
quant:
- model: '.'
  rules:
    - regex: 'kv_b_proj'
      type: null
    - regex: '(\.self_attn|\.mlp\.(shared_experts\.)?(gate_proj|gate_up_proj|up_proj|down_proj))'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
    - regex: '\.mlp\.(moe|experts)'
      type: w8a8_per_token_per_channel_dyn
      kwargs:
        weight_scale_has_singleton_last_dim: True
- kv_cache: '.'
  rules:
    - regex: '^(kv_lora|k_pe)$'
      type: fp8_pertoken_dsa
