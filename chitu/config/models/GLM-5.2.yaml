# GLM-5.2 uses model_glm52.py (TransformerGLM52), which extends DeepSeek-V3
# with a shared top-k indexer schedule driven by per-layer "full"/"shared"
# roles read from config.json ``indexer_types``.
defaults:
  - GLM-5
  - _self_ # Config in this file overrides configs in defaults

# Access info
name: GLM-5.2
type: glm-5-2
source: "https://huggingface.co/zai-org/GLM-5.2" # Just for displaying. No automatic download.

# Enables the shared top-k buffer + per-layer "full"/"shared" indexer
# scheduling in TransformerGLM52. Required for GLM-5.2; vanilla
# DeepSeek-V3 leaves this unset (false).
share_index_cache: true

# GLM-5.2 fields read directly from config.json. ``indexer_types`` is the
# per-layer ``"full"`` / ``"shared"`` schedule driving the shared top-k
# buffer; the others are passed through so future code can reference them
# without re-binding. ``mlp_layer_types`` is intentionally NOT bound: in this
# generation it degenerates to the ``first_k_dense_replace`` prefix rule and
# the model dispatches MLP via ``layer_id < args.n_dense_layers``.
indexer_types: "$(config.json:indexer_types)"
index_topk_freq: "$(config.json:index_topk_freq)"
index_skip_topk_offset: "$(config.json:index_skip_topk_offset)"
index_share_for_mtp_iteration: "$(config.json:index_share_for_mtp_iteration)"

# rope_theta already inherits the `$(config.json:rope_parameters.rope_theta)`
# binding from GLM-5.yaml; for GLM-5.2 this resolves to 8_000_000.
