# GLM-5.3-BF16 shares the same model architecture as GLM-5.2
#
# NOTE: GLM-5.3 has a different naming convention than GLM-5.2:
# - GLM-5.2 and GLM-5.3-BF16 are BF16 models.
# - GLM-5.2-FP8 and GLM-5.3 are FP8 models
defaults:
  - GLM-5.2
  - _self_ # Config in this file overrides configs in defaults

name: GLM-5.3-BF16
source: "https://huggingface.co/zai-org/GLM-5.3-BF16" # Just for displaying. No automatic download.
