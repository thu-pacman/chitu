# PD disaggregation base config overlay
# 仅保留 PD 分离相关配置；其余模型/推理通用项从基础 serve_config 继承
# 适用于任意 XP-YD 拓扑：启动脚本通过 Hydra override 动态覆盖
# prefill_schedulers / decode_schedulers 列表与 n_insts 等字段

defaults:
  - serve_config
  - _self_

multi_inst:
  enabled: True
  n_insts: 2           # P + D 总实例数（启动时覆盖）
  inst_id: 0

  router:
    is_router: True
    launch_timeout: 3600
    max_inflight_per_instance: 24 # max number of inflight requests per dp instance
    # Used by unified DP routing, and by PD prefill routing when PD disaggregation is enabled.
    routing_algorithm: "prefix_cache_aware" # option: round_robin, power_of_two_choices, prefix_cache_aware
    # Used only by PD decode routing when PD disaggregation is enabled.
    routing_algorithm_for_decode: "power_of_two_choices" # option: round_robin, power_of_two_choices

    router_cache_miss_fallback_algorithm: "power_of_two_choices" 
    router_hit_weight: 1.0 # The weight of the prefix cache hit block count during router routing tasks.
    router_load_penalty_weight: 0.02 # The penalty weight of instance load during router routing tasks.
    router_evict_buffer_size: 64 

    # PD 分离配置（协调/元数据同步、RDMA 后端与 Bootstrap）
    # NOTE: To enable verbose logging for PD disaggregation, set the following:
    # CHITU_LOGGING_LEVEL=chitu.distributed.pd_disaggregation:DEBUG;chitu.hooks:DEBUG;chitu.scheduler:DEBUG
    pd_disaggregation:
      enabled: True
      kv_transfer_backend: "mooncake"
      bootstrap_port: 8080

      kv_transfer:
        buffer_size: 2048
        transfer_timeout: 30.0
        max_concurrent_transfers: 8
        # Decode-side status wait/retry loop (kv_manager.recv_kv_cache_and_insert)
        decode_wait_timeout_s: 300.0
        decode_resend_interval_s: 0.5
        decode_poll_interval_s: 0.05

    # Prefill/Decode Scheduler 默认各 1 个；启动时按实际拓扑覆盖
    prefill_schedulers:
      - max_batch_size: 32
        max_total_tokens: 8192
        batching_strategy: "varlen"

    decode_schedulers:
      - scheduling_strategy: "immediate"
