# PD disaggregation base config overlay
# 仅保留 PD 分离相关配置；其余模型/推理通用项从基础 serve_config 继承
# 适用于任意 XP-YD 拓扑：启动脚本通过 Hydra override 动态覆盖
# prefill_schedulers / decode_schedulers 列表与 dp_size 等字段

defaults:
  - serve_config
  - _self_

dp_config:
  enabled: True
  scheduler_base_host: 0.0.0.0
  scheduler_base_port: 29610
  dp_size: 2           # P + D 总实例数（启动时覆盖）
  dp_id: 0
  tp_size: 1
  pp_size: 1

  router:
    is_router: True
    host: 0.0.0.0
    port: 21003
    stats_port: 29600
    token_port: 29700
    load_balancer_algorithm: "power_of_two_choices"

    # PD 分离配置（协调/元数据同步、RDMA 后端与 Bootstrap）
    pd_disaggregation:
      enabled: True
      log_verbose: False
      coordination_port: 29800
      metadata_sync_port: 29801
      kv_transfer_backend: "mooncake"
      ib_device: "mlx5_0"
      bootstrap_port: 8080

      kv_transfer:
        buffer_size: 2048
        transfer_timeout: 30.0
        max_concurrent_transfers: 8
        # Decode-side status wait/retry loop (kv_manager.recv_kv_cache_and_insert)
        decode_wait_timeout_s: 300.0
        decode_resend_interval_s: 0.5
        decode_poll_interval_s: 0.05

    # Prefill/Decode Scheduler 默认各 1 个；启动时按实际拓扑覆盖
    prefill_schedulers:
      - host: 0.0.0.0
        port: 29620
        max_batch_size: 32
        max_total_tokens: 8192
        batching_strategy: "varlen"

    decode_schedulers:
      - host: 0.0.0.0
        port: 29630
        scheduling_strategy: "immediate"
